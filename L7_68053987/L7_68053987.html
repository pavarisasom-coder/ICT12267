<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>Workshop Form</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- เรียกใช้ CSS แยก -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
  <div class="container">
    <a class="navbar-brand" href="#">Pavarisa somee</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="menu">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link" href="#">หน้าแรก</a></li>
        <li class="nav-item"><a class="nav-link" href="#formSection">ลงทะเบียน</a></li>
        <li class="nav-item"><a class="nav-link" href="#">ติดต่อเรา</a></li>
      </ul>
    </div>
  </div>
</nav>


<!-- Banner -->
<section class="banner">
    <video id="myVideo" autoplay loop muted>
        <source src="fffff.mp4" type="video/mp4">
    </video>

</section>

<div class="text-center py-4 bg-white shadow-sm">
    <button class="glass-btn me-2" onclick="playVideo()">▶ Play</button>
    <button class="glass-btn" onclick="pauseVideo()">⏸ Pause</button>
</div>

<!-- Form -->
<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-lg-6 col-md-8" id="formSection">
    <div class="card shadow">
        <div class="card-header bg-primary text-white">
            <h4 class="mb-0">แบบฟอร์มลงทะเบียน</h4>
        </div>

        <div class="card-body">
            <form>
                <div class="mb-3">
                    <label class="form-label">ชื่อ-นามสกุล</label>
                    <input type="text" class="form-control" placeholder="กรุณากรอกชื่อ-นามสกุล">
                </div>

                <div class="mb-3">
                    <label class="form-label">อีเมล</label>
                    <input type="email" class="form-control" placeholder="example@domain.com">
                </div>

                <div class="mb-3">
                    <label class="form-label">รหัสผ่าน</label>
                    <input type="password" class="form-control">
                </div>

                <div class="mb-3">
                    <label class="form-label d-block">เพศ</label>
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="radio" name="gender">
                        <label class="form-check-label">ชาย</label>
                    </div>
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="radio" name="gender">
                        <label class="form-check-label">หญิง</label>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label">ตำแหน่ง</label>
                    <select class="form-select">
                        <option selected disabled>-- กรุณาเลือกตำแหน่ง --</option>
                        <option>Manager</option>
                        <option>Developer</option>
                        <option>Designer</option>
                        <option>Marketing</option>
                    </select>
                </div>

                <button type="submit" class="btn btn-success">ลงทะเบียน</button>
                <button type="reset" class="btn btn-danger">ล้างข้อมูล</button>
            </form>
        </div>
    </div>
</div>


<script>
function playVideo() {
    document.getElementById("myVideo").play();
}

function pauseVideo() {
    document.getElementById("myVideo").pause();
}
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
